name: Build

on:
  push:

jobs:
  build-linux:
    name: Build on Linux
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v1
    - name: Install packages
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential libgl1-mesa-dev libglu1-mesa-dev libxkbcommon-dev libxcb-cursor-dev p7zip-full
    - name: Install Qt
      uses: ./.github/actions/download-qt
      with:
        toolchain: gcc_64
        components: qtbase icu
    - name: Install Qbs
      uses: ./.github/actions/download-qbs
    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.12'
    - name: Install Conan
      uses: turtlebrowser/get-conan@main
    - name: Configure Conan remote
      run: conan remote update conancenter --url="https://center2.conan.io"
    - name: Setup Conan profiles
      run: ./scripts/setup-conan-profiles.sh --toolchain gcc_64
    - name: Setup Qbs
      run: |
        qbs setup-toolchains --detect
        qbs setup-qt $(which qmake) qt
        # Qt 6.12 qobject_impl.h exposes an anonymous-namespace type from a
        # module unit. GCC rejects that (https://bugreports.qt.io/browse/QTBUG-142513);
        # a newer GCC does not change the header. Clang accepts it.
        qbs config profiles.qt.baseProfile clang-18
        qbs config defaultProfile qt
        qbs config --list
    - name: Build
      run: |
        qbs resolve project.conanProfile:ci config:release
        qbs build config:release

  build-macos:
    name: Build on macOS
    runs-on: macos-26
    steps:
    - uses: actions/checkout@v1
    - name: Install Qt
      uses: ./.github/actions/download-qt
      with:
        toolchain: clang_64
    - name: Install Qbs
      uses: ./.github/actions/download-qbs
    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.12'
    - name: Install Conan
      uses: turtlebrowser/get-conan@main
    - name: Configure Conan remote
      run: conan remote update conancenter --url="https://center2.conan.io"
    - name: Setup Conan profiles
      run: ./scripts/setup-conan-profiles.sh --toolchain clang_64
    - name: Setup Qbs
      run: |
        qbs setup-toolchains --detect
        qbs setup-qt --detect
        # llvm@20 is preinstalled and keg-only, so --detect never creates a profile.
        qbs setup-toolchains --type clang "$(brew --prefix llvm@20)/bin/clang" llvm
        # Unlike Apple Clang, this compiler does not default to the macOS SDK.
        qbs config profiles.llvm.cpp.sysroot "$(xcrun --sdk macosx --show-sdk-path)"
        qbs config profiles.qt.baseProfile llvm
        qbs config defaultProfile qt
        qbs config --list
    - name: Build
      run: |
        qbs resolve project.conanProfile:ci config:release
        qbs build config:release

  build-windows:
    name: Build on Windows
    runs-on: windows-2022
    steps:
    - uses: actions/checkout@v1
    - name: Install Qt
      uses: ./.github/actions/download-qt
      with:
        toolchain: win64_msvc2022_64
    - name: Install Qbs
      uses: ./.github/actions/download-qbs
    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.12'
    - name: Install Conan
      uses: turtlebrowser/get-conan@main
    - name: Configure Conan remote
      run: conan remote update conancenter --url="https://center2.conan.io"
      shell: bash
    - name: Setup Conan profiles
      run: ./scripts/setup-conan-profiles.sh --toolchain msvc_64
      shell: bash
    - name: Setup Qbs
      run: |
        qbs setup-toolchains --detect
        qbs setup-qt $(which qmake).exe qt
        qbs config profiles.qt.baseProfile MSVC2022-x64
        qbs config defaultProfile qt
        qbs config --list
      shell: bash
    - name: Build
      run: |
        qbs resolve project.conanProfile:ci config:release
        qbs build config:release
      shell: bash
