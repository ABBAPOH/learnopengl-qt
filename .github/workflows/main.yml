name: Build

on:
  push:

jobs:
  build-linux:
    name: Build on Linux
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v1
    - name: Install packages
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential libgl1-mesa-dev libglu1-mesa-dev libxkbcommon-dev libxcb-cursor-dev p7zip-full
    - name: Install Qt
      uses: ./.github/actions/download-qt
      with:
        toolchain: gcc_64
    - name: Install Qbs
      uses: ./.github/actions/download-qbs
    - name: Setup Qbs
      run: |
        qbs setup-toolchains --detect
        qbs setup-qt $(which qmake) qt
        qbs config defaultProfile qt
        qbs config --list
    - name: Build
      run: |
        qbs resolve
        qbs build

  build-macos:
    name: Build on macOS
    runs-on: macos-26
    steps:
    - uses: actions/checkout@v1
    - name: Install Qt
      uses: ./.github/actions/download-qt
      with:
        toolchain: clang_64
    - name: Install Qbs
      uses: ./.github/actions/download-qbs
    - name: Setup Qbs
      run: |
        qbs setup-toolchains --detect
        qbs setup-qt --detect
        qbs config profiles.qt.baseProfile xcode_13_2_1-macosx-x86_64
        qbs config defaultProfile qt
        qbs config --list
    - name: Build
      run: |
        qbs resolve
        qbs build

  build-windows:
    name: Build on Windows
    runs-on: windows-2025
    steps:
    - uses: actions/checkout@v1
    - name: Install Qt
      uses: ./.github/actions/download-qt
      with:
        toolchain: win64_msvc2022_64
    - name: Install Qbs
      uses: ./.github/actions/download-qbs
    - name: Setup Qbs
      run: |
        qbs setup-toolchains --detect
        qbs setup-qt $(which qmake).exe qt
        qbs config profiles.qt.baseProfile MSVC2022-1-x86_x64
        qbs config defaultProfile qt
        qbs config --list
      shell: bash
    - name: Build
      run: |
        qbs resolve
        qbs build
      shell: bash
